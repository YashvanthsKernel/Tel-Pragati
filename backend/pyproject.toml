[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "baghewala-digital-twin"
version = "1.0.0"
description = "Baghewala Well-to-Surface Digital Twin Backend — Oil India Limited SIH 2026"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "websockets==13.1",
    "python-multipart==0.0.12",
    # Database
    "asyncpg==0.29.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.10",
    # Validation & Serialization
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    # MQTT
    "aiomqtt==2.3.0",
    "paho-mqtt==2.1.0",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # Physics & ML
    "numpy==2.1.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "xgboost==2.1.3",
    "lightgbm==4.5.0",
    "shap==0.46.0",
    "mlflow==2.17.2",
    "optuna==4.0.0",
    # Monitoring
    "evidently==0.6.7",
    "prometheus-client==0.21.0",
    # Utilities
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "redis==5.1.1",
    "celery[redis]==5.4.0",
    "pymoo==0.6.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.7.0",
    "mypy==1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
