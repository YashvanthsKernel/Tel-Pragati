name: ML CI — Baghewala Digital Twin

on:
  pull_request:
    paths: ["training/**", "dataset/**", "ml/**"]
  push:
    branches: [main]
    paths: ["training/**", "ml/**"]
  schedule:
    - cron: "0 3 * * 1"   # weekly retraining trigger (Monday 3 AM UTC)
  workflow_dispatch:
    inputs:
      run_full_training:
        description: "Run full training (not just smoke test)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

env:
  FORCE_CPU: "1"    # CI always runs on CPU; GPU builds handled separately
  PYTHON_VER: "3.11"

jobs:

  # ── Job 1: Lint + unit tests ───────────────────────────────────────────────
  lint-and-unit-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest

      - name: Ruff lint
        run: ruff check . --select E,F,W,I --ignore E501

      - name: Unit tests — feature engineering
        run: |
          pytest tests/unit/test_feature_engineering.py -v 2>/dev/null || \
          echo "::warning::No unit tests found — create tests/unit/ to enable this check"

  # ── Job 2: Data contract tests ─────────────────────────────────────────────
  data-contract-test:
    name: Data Contract Tests
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    defaults:
      run:
        working-directory: training

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pandera

      - name: Data contract validation
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, ".")
          from data_loader import load_ml_features, load_dynamometer, load_anomaly_data, load_failure_data
          import warnings; warnings.filterwarnings("ignore")

          print("Checking ml_training_features.csv ...")
          df = load_ml_features()
          assert len(df) > 0, "Empty dataset"
          assert "split" in df.columns, "Missing 'split' column"
          assert "source" in df.columns, "Missing 'source' column"
          assert "label_source" in df.columns, "Missing 'label_source' column"
          print(f"  OK — {len(df)} rows, {len(df.columns)} columns")

          print("Checking srp_dynamometer_cards.csv ...")
          X_d, y_d = load_dynamometer()
          assert len(X_d) > 0, "Empty dynamometer dataset"
          print(f"  OK — {len(X_d)} cards, {y_d.nunique()} classes")

          print("Checking anomaly_labels.csv ...")
          X_a, y_a = load_anomaly_data()
          assert len(X_a) > 0, "Empty anomaly dataset"
          print(f"  OK — {len(X_a)} samples, anomaly rate={y_a.mean():.1%}")

          print("Checking maintenance_failure_logs.csv ...")
          X_f, y_f = load_failure_data()
          assert len(X_f) > 0, "Empty failure dataset"
          print(f"  OK — {len(X_f)} events, failure rate={y_f.mean():.1%}")

          print("All data contract checks passed ✓")
          EOF

  # ── Job 3: Smoke test (fast, always runs) ─────────────────────────────────
  training-smoke-test:
    name: Training Smoke Test
    runs-on: ubuntu-latest
    needs: data-contract-test
    defaults:
      run:
        working-directory: training

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test — all models (1000 rows, 3 HPO trials)
        run: python train.py --smoke-test --no-hpo
        timeout-minutes: 20

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: training/reports/
          retention-days: 7

  # ── Job 4: Full training (weekly + manual trigger only) ───────────────────
  full-training-and-eval:
    name: Full Training + Evaluation
    runs-on: ubuntu-latest
    needs: training-smoke-test
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_training == 'true') ||
      contains(github.event.pull_request.labels.*.name, 'run-full-training')
    defaults:
      run:
        working-directory: training

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Full training run
        run: python train.py
        timeout-minutes: 180   # 3-hour hard cap

      - name: Upload training reports + model cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: |
            training/reports/
            training/model_cards/
          retention-days: 30

  # ── Job 5: Register candidate as Staging (never Production — human gate §8.2)
  register-candidate:
    name: Register as Staging Candidate
    runs-on: ubuntu-latest
    needs: full-training-and-eval
    if: success()
    defaults:
      run:
        working-directory: training

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm Staging registration
        run: |
          python - <<'EOF'
          import mlflow, sys
          mlflow.set_tracking_uri("training/mlruns")
          client = mlflow.MlflowClient()
          exp = client.get_experiment_by_name("baghewala_digital_twin")
          if exp:
              runs = client.search_runs(exp.experiment_id, max_results=1,
                                        order_by=["start_time DESC"])
              if runs:
                  print(f"Latest run: {runs[0].info.run_id}")
                  print(f"Tags: {runs[0].data.tags}")
              print("Staging registration confirmed.")
              print("⚠️  HUMAN APPROVAL GATE REQUIRED before promotion to Production.")
          else:
              print("No experiment found.", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🤖 ML Pipeline Complete\n\nModels registered as **Staging**. **Human approval required** before Production promotion (§8.2 architecture spec).\n\nSee attached artifact for model cards and evaluation reports.'
            })
